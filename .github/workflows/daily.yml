name: Өдрийн үгийн мэдэгдэл
on:
  schedule:
    # GitHub хуваарийг олонтаа алгасдаг тул цаг тутам оролдоно; нэг удаа ажиллахад л
    # ирэх 24 цагийн мэдэгдэл товлогдоно (send.mjs-ийг үз).
    - cron: "23 * * * *"
  workflow_dispatch: {}
concurrency:
  group: daily-notify
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node send.mjs
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          SITE: https://solongo-dict.netlify.app
